databases:
  - name: secrets-db
    databaseName: secrets_production
    user: secrets_user
    region: oregon
    plan: free

services:
  - type: web
    name: secrets-app
    runtime: node
    region: oregon
    plan: free
    branch: main

    buildCommand: npm ci && node db/seed.js
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    pullRequestPreviewsEnabled: true

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

      # Database connection — all properties sourced from the managed database
      - key: PG_HOST
        fromDatabase:
          name: secrets-db
          property: host
      - key: PG_PORT
        fromDatabase:
          name: secrets-db
          property: port
      - key: PG_DATABASE
        fromDatabase:
          name: secrets-db
          property: database
      - key: PG_USER
        fromDatabase:
          name: secrets-db
          property: user
      - key: PG_PASSWORD
        fromDatabase:
          name: secrets-db
          property: password

      # Session secret — generated once at first deploy, stable across restarts
      - key: SESSION_SECRET
        generateValue: true

      # Google OAuth — set manually in the Render dashboard after deploy
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: "https://secrets-app-c07z.onrender.com/auth/google/secrets"
